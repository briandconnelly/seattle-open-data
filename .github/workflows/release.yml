name: Release

# On a v* tag: verify versions agree and the full gate passes, build and smoke-test the wheel,
# sdist, and .mcpb (build.yml), publish the wheel and sdist to PyPI (the `pypi` environment
# requires a maintainer's approval), then create a GitHub Release carrying all three files.
#
# Run it manually (workflow_dispatch) to rehearse without a tag: the same verify, build, and smoke
# test, plus an optional upload to TestPyPI that exercises trusted publishing end to end. A manual
# run never touches PyPI or GitHub Releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Where a rehearsal publishes the wheel and sdist"
        type: choice
        options: [none, testpypi]
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify versions and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false # release artifacts never build from a restored cache

      - name: Sync dependencies
        run: uv sync --locked

      - name: pyproject, manifest, CHANGELOG (and the tag, if any) agree
        env:
          # Empty on a manual run from a branch: there is no tag to compare.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run python - "${TAG#v}" <<'PY'
          import json, re, sys, tomllib
          from pathlib import Path

          tag = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          manifest = json.loads(Path("manifest.json").read_text())["version"]
          # Latest released section: the first `## [X.Y.Z]` heading, skipping [Unreleased].
          m = re.search(r"^## \[(\d+\.\d+\.\d+[^\]]*)\]", Path("CHANGELOG.md").read_text(), re.M)
          changelog = m.group(1) if m else None

          versions = {"manifest.json": manifest, "latest CHANGELOG": changelog}
          if tag:
              versions["git tag"] = tag
          errors = [
              f"{name} version {value!r} != pyproject version {pyproject!r}"
              for name, value in versions.items()
              if value != pyproject
          ]
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK: {', '.join(['pyproject', *versions])} all agree on {pyproject}")
          PY

      - name: Manifest is in sync with the live server
        run: uv run python scripts/gen_manifest.py --check

      - name: Lint, types, and tests
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      cache: false # release artifacts never build from a restored cache

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    environment:
      name: pypi # requires a maintainer's approval
      url: https://pypi.org/p/seattle-open-data
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Drop the bundle; PyPI takes only the wheel and sdist
        run: rm -f dist/*.mcpb

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # Reruns after a later failure must not trip PyPI's duplicate-file error.
          skip-existing: true

  publish-testpypi:
    name: Publish to TestPyPI (rehearsal)
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/p/seattle-open-data
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Drop the bundle; TestPyPI takes only the wheel and sdist
        run: rm -f dist/*.mcpb

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI never accepts a version twice; a repeat rehearsal is a no-op upload.
          skip-existing: true

  release:
    name: Create GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No CHANGELOG section for $version"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/*.mcpb \
            --title "$GITHUB_REF_NAME" --notes-file release_notes.md --verify-tag
